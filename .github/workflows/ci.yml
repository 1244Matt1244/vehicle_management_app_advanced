name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore VehicleApp.sln

      - name: Build
        run: dotnet build VehicleApp.sln --no-restore -c Release

      - name: Test
        run: dotnet test VehicleApp.sln --no-build -c Release --verbosity normal
